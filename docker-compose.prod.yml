version: "3.9"

# ==========================================
# Docker Compose Production
# Copy gần nguyên docker-compose.yml gốc, chỉ thay image sang GAR
# Chạy: docker compose -f docker-compose.prod.yml up -d
# ==========================================

services:
  nginx:
    image: nginx:1.27.2
    restart: unless-stopped
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/configuration/custom_proxy_settings.conf:/etc/nginx/conf.d/custom_proxy_settings.conf
    ports:
      - "80:80"
    networks:
      - yas-network

  identity:
    image: quay.io/keycloak/keycloak:26.0.2
    command: 'start-dev --import-realm'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KC_HTTP_PORT: 80
    volumes:
      - ./identity/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./identity/themes/yas/theme:/opt/keycloak/themes
    networks:
      - yas-network

  backoffice:
    image: ghcr.io/nashtech-garage/yas-backoffice-bff:latest
    entrypoint: ["./wait-for-it.sh", "identity:80", "--timeout=300", "--", "java", "-jar", "/app.jar"]
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  backoffice-nextjs:
    image: ghcr.io/nashtech-garage/yas-backoffice:latest
    networks:
      - yas-network

  storefront:
    image: ghcr.io/nashtech-garage/yas-storefront-bff:latest
    entrypoint: ["./wait-for-it.sh", "identity:80", "--timeout=300", "--", "java", "-jar", "/app.jar"]
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - YAS_SERVICES_CUSTOMER=http://customer/customer
      - YAS_SERVICES_CART=http://cart/cart
      - YAS_SERVICES_RATING=http://rating/rating
      - YAS_SERVICES_ORDER=http://order/order
      - YAS_SERVICES_LOCATION=http://location/location
      - YAS_SERVICES_INVENTORY=http://inventory/inventory
      - YAS_SERVICES_TAX=http://tax/tax
      - YAS_SERVICES_PROMOTION=http://promotion/promotion
      - YAS_SERVICES_PAYMENT=http://payment/payment
      - YAS_SERVICES_SAMPLE_DATA=http://sampledata/sampledata
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  storefront-nextjs:
    image: ghcr.io/nashtech-garage/yas-storefront:latest
    networks:
      - yas-network

  media:
    image: ghcr.io/nashtech-garage/yas-media:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/media
      - SERVER_SERVLET_CONTEXT_PATH=/media
      - YAS_PUBLIC_URL=http://api.yas.local/media
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
      - ./sampledata/images:/images
    networks:
      - yas-network

  product:
    image: ghcr.io/nashtech-garage/yas-product:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product
      - SERVER_SERVLET_CONTEXT_PATH=/product
      - YAS_SERVICES_MEDIA=http://media/media
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  customer:
    image: ghcr.io/nashtech-garage/yas-customer:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/customer
      - SERVER_SERVLET_CONTEXT_PATH=/customer
      - YAS_SERVICES_LOCATION=http://location/location
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  cart:
    image: ghcr.io/nashtech-garage/yas-cart:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cart
      - SERVER_SERVLET_CONTEXT_PATH=/cart
      - YAS_SERVICES_MEDIA=http://media/media
      - YAS_SERVICES_PRODUCT=http://product/product
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  rating:
    image: ghcr.io/nashtech-garage/yas-rating:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rating
      - SERVER_SERVLET_CONTEXT_PATH=/rating
      - YAS_PUBLIC_URL=http://api.yas.local/rating
      - YAS_SERVICES_PRODUCT=http://product/product
      - YAS_SERVICES_CUSTOMER=http://customer/customer
      - YAS_SERVICES_ORDER=http://order/order
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  order:
    image: ghcr.io/nashtech-garage/yas-order:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order
      - SERVER_SERVLET_CONTEXT_PATH=/order
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
      - YAS_PUBLIC_URL=http://api.yas.local/order
      - YAS_SERVICES_CART=http://cart/cart
      - YAS_SERVICES_CUSTOMER=http://customer/customer
      - YAS_SERVICES_PRODUCT=http://product/product
      - YAS_SERVICES_TAX=http://tax/tax
      - YAS_CURRENCY_UNIT=VND
      - YAS_PRICE_INCLUDES_TAX=false
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  payment:
    image: ghcr.io/nashtech-garage/yas-payment:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment
      - SERVER_SERVLET_CONTEXT_PATH=/payment
      - YAS_PUBLIC_URL=http://api.yas.local/payment
      - YAS_SERVICES_ORDER=http://order/order
      - YAS_SERVICES_MEDIA=http://media/media
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
      - YAS_CURRENCY_UNIT=VND
      - YAS_PRICE_INCLUDES_TAX=false
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  location:
    image: ghcr.io/nashtech-garage/yas-location:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/location
      - SERVER_SERVLET_CONTEXT_PATH=/location
      - YAS_PUBLIC_URL=http://api.yas.local/location
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  inventory:
    image: ghcr.io/nashtech-garage/yas-inventory:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inventory
      - SERVER_SERVLET_CONTEXT_PATH=/inventory
      - YAS_PUBLIC_URL=http://api.yas.local/inventory
      - YAS_SERVICES_PRODUCT=http://product/product
      - YAS_SERVICES_LOCATION=http://location/location
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  promotion:
    image: ghcr.io/nashtech-garage/yas-promotion:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/promotion
      - SERVER_SERVLET_CONTEXT_PATH=/promotion
      - YAS_PUBLIC_URL=http://api.yas.local/promotion
      - YAS_SERVICES_PRODUCT=http://product/product
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  tax:
    image: ghcr.io/nashtech-garage/yas-tax:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tax
      - SERVER_SERVLET_CONTEXT_PATH=/tax
      - YAS_PUBLIC_URL=http://api.yas.local/tax
      - YAS_SERVICES_LOCATION=http://location/location
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  sampledata:
    image: ghcr.io/nashtech-garage/yas-sampledata:latest
    environment:
      - SPRING_DATASOURCE_PRODUCT_URL=jdbc:postgresql://postgres:5432/product
      - SPRING_DATASOURCE_MEDIA_URL=jdbc:postgresql://postgres:5432/media
      - SERVER_SERVLET_CONTEXT_PATH=/sampledata
      - YAS_PUBLIC_URL=http://api.yas.local/sampledata
      - YAS_SERVICES_SAMPLE_DATA=http://sampledata/sampledata
      - SERVER_PORT=80
      - LOGGING_CONFIG=/app-config/logback-spring.xml
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      - BASE_URL=/swagger-ui
      - "URLS=[{ url: 'http://api.yas.local/product/v3/api-docs', name: 'Product' },{ url: 'http://api.yas.local/media/v3/api-docs', name: 'Media' },{ url: 'http://api.yas.local/customer/v3/api-docs', name: 'Customer' },{ url: 'http://api.yas.local/cart/v3/api-docs', name: 'Cart'},{ url: 'http://api.yas.local/rating/v3/api-docs', name: 'Rating' }, { url: 'http://api.yas.local/order/v3/api-docs', name: 'Order'},{ url: 'http://api.yas.local/payment/v3/api-docs', name: 'Payment'},{ url: 'http://api.yas.local/location/v3/api-docs', name: 'Location'}, { url: 'http://api.yas.local/inventory/v3/api-docs', name: 'Inventory'},{ url: 'http://api.yas.local/tax/v3/api-docs', name: 'Tax' },{ url: 'http://api.yas.local/promotion/v3/api-docs', name: 'Promotion'}]"
      - OAUTH_CLIENT_ID=swagger-ui
      - OAUTH_USE_PKCE=true
    networks:
      - yas-network

  postgres:
    image: debezium/postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql
      - postgres:/var/lib/postgresql/data
    command: postgres -c 'max_connections=500'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    networks:
      - yas-network

  zookeeper:
    image: debezium/zookeeper:2.7.3.Final
    restart: unless-stopped
    networks:
      - yas-network

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - yas-network

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - yas-network

networks:
  yas-network:
    driver: bridge
    name: yas-network

volumes:
  postgres:
  redis:
