version: "3.9"

# ==========================================
# Docker Compose Production - Backend Only
# Frontend (storefront-nextjs, backoffice-nextjs) chạy trên Cloud Storage + CDN
# Tất cả secrets được đọc từ file .env.prod (KHÔNG commit lên Git)
# Chạy: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# ==========================================

services:
  nginx:
    image: nginx:1.27.2
    restart: unless-stopped
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/configuration/custom_proxy_settings.conf:/etc/nginx/conf.d/custom_proxy_settings.conf
    ports:
      - "80:80"
    networks:
      - yas-network

  identity:
    image: quay.io/keycloak/keycloak:26.0.2
    command: 'start-dev --import-realm'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_PORT: 80
    volumes:
      - ./identity/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./identity/themes/yas/theme:/opt/keycloak/themes
    networks:
      - yas-network

  backoffice:
    image: ${GAR_REPO}/yas-backoffice-bff:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - LOGGING_CONFIG
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  storefront:
    image: ${GAR_REPO}/yas-storefront-bff:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - YAS_SERVICES_CUSTOMER=http://customer:8080
      - YAS_SERVICES_CART=http://cart:8080
      - YAS_SERVICES_RATING=http://rating:8080
      - YAS_SERVICES_ORDER=http://order:8080
      - YAS_SERVICES_LOCATION=http://location:8080
      - YAS_SERVICES_INVENTORY=http://inventory:8080
      - YAS_SERVICES_TAX=http://tax:8080
      - YAS_SERVICES_PROMOTION=http://promotion:8080
      - YAS_SERVICES_PAYMENT=http://payment:8080
      - YAS_SERVICES_SAMPLE_DATA=http://sampledata:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  media:
    image: ${GAR_REPO}/yas-media:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/media
      - SERVER_SERVLET_CONTEXT_PATH=/media
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
      - ./sampledata/images:/images
    networks:
      - yas-network

  product:
    image: ${GAR_REPO}/yas-product:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product
      - SERVER_SERVLET_CONTEXT_PATH=/product
      - YAS_SERVICES_MEDIA=http://media:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  customer:
    image: ${GAR_REPO}/yas-customer:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/customer
      - SERVER_SERVLET_CONTEXT_PATH=/customer
      - YAS_SERVICES_LOCATION=http://location:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  cart:
    image: ${GAR_REPO}/yas-cart:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cart
      - SERVER_SERVLET_CONTEXT_PATH=/cart
      - YAS_SERVICES_MEDIA=http://media:8080
      - YAS_SERVICES_PRODUCT=http://product:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  rating:
    image: ${GAR_REPO}/yas-rating:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rating
      - SERVER_SERVLET_CONTEXT_PATH=/rating
      - YAS_SERVICES_PRODUCT=http://product:8080
      - YAS_SERVICES_CUSTOMER=http://customer:8080
      - YAS_SERVICES_ORDER=http://order:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  order:
    image: ${GAR_REPO}/yas-order:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order
      - SERVER_SERVLET_CONTEXT_PATH=/order
      - YAS_SERVICES_CART=http://cart:8080
      - YAS_SERVICES_CUSTOMER=http://customer:8080
      - YAS_SERVICES_PRODUCT=http://product:8080
      - YAS_SERVICES_TAX=http://tax:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  payment:
    image: ${GAR_REPO}/yas-payment:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment
      - SERVER_SERVLET_CONTEXT_PATH=/payment
      - YAS_SERVICES_ORDER=http://order:8080
      - YAS_SERVICES_MEDIA=http://media:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  location:
    image: ${GAR_REPO}/yas-location:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/location
      - SERVER_SERVLET_CONTEXT_PATH=/location
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  inventory:
    image: ${GAR_REPO}/yas-inventory:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inventory
      - SERVER_SERVLET_CONTEXT_PATH=/inventory
      - YAS_SERVICES_PRODUCT=http://product:8080
      - YAS_SERVICES_LOCATION=http://location:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  promotion:
    image: ${GAR_REPO}/yas-promotion:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/promotion
      - SERVER_SERVLET_CONTEXT_PATH=/promotion
      - YAS_SERVICES_PRODUCT=http://product:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  tax:
    image: ${GAR_REPO}/yas-tax:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tax
      - SERVER_SERVLET_CONTEXT_PATH=/tax
      - YAS_SERVICES_LOCATION=http://location:8080
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  sampledata:
    image: ${GAR_REPO}/yas-sampledata:latest
    environment:
      - SPRING_DATASOURCE_PRODUCT_URL=jdbc:postgresql://postgres:5432/product
      - SPRING_DATASOURCE_MEDIA_URL=jdbc:postgresql://postgres:5432/media
      - SERVER_SERVLET_CONTEXT_PATH=/sampledata
      - SERVER_PORT=8080
    volumes:
      - ./deployment/app-config:/app-config
    networks:
      - yas-network

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      - BASE_URL=/swagger-ui
    networks:
      - yas-network

  postgres:
    image: debezium/postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - yas-network

  zookeeper:
    image: debezium/zookeeper:2.7.3.Final
    restart: unless-stopped
    networks:
      - yas-network

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - yas-network

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - yas-network

networks:
  yas-network:
    driver: bridge
    name: yas-network

volumes:
  postgres:
  redis:
